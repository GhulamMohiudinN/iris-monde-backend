<!DOCTYPE html>
<html>
  <body style="margin:0; padding:0; background:#f6f8fb; font-family:Arial, Helvetica, sans-serif;">
    <table width="100%" bgcolor="#f6f8fb" cellpadding="0" cellspacing="0" style="padding:40px 0;">
      <tr>
        <td align="center">
          <table width="480" cellpadding="0" cellspacing="0" style="background:#ffffff; border-radius:12px; overflow:hidden; box-shadow:0 10px 30px rgba(15,23,42,0.08);">

            <!-- Header / logo -->
            <tr>
              <td align="center" style="background:#111827; padding:28px 40px;">
                <img src="{{logoUrl}}" alt="Iris Monde" width="44" height="44" style="border-radius:9px; display:block; margin:0 auto;" />
                <div style="margin-top:12px; color:#ffffff; font-size:17px; font-weight:700; letter-spacing:0.2px;">Iris Monde</div>
                <div style="color:#94a3b8; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:2px; margin-top:2px;">Workspace</div>
              </td>
            </tr>

            <!-- Body -->
            <tr>
              <td style="padding:36px 40px 8px 40px;">
                <h2 style="margin:0 0 14px 0; color:#111827; font-size:20px; font-weight:800;">{{title}}</h2>
                <p style="margin:0 0 20px 0; color:#475569; font-size:14px; line-height:22px;">{{bodyText}}</p>

                <div style="text-align:center; margin:28px 0;">
                  <a href="{{buttonUrl}}"
                    style="background:#2563eb; color:#ffffff; padding:13px 32px; border-radius:8px; text-decoration:none; font-weight:700; font-size:14px; display:inline-block;">
                    {{buttonLabel}}
                  </a>
                </div>

                <p style="margin:20px 0 0 0; color:#94a3b8; font-size:12px; line-height:20px;">
                  If the button above doesn&rsquo;t work, copy and paste this link into your browser:
                </p>
                <p style="word-break:break-all; font-size:12px; color:#2563eb; margin:6px 0 0 0;">{{buttonUrl}}</p>

                <p style="margin-top:28px; font-size:12px; color:#94a3b8; line-height:18px;">{{footerNote}}</p>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td align="center" style="padding:20px 40px 28px 40px; border-top:1px solid #e2e8f0;">
                <p style="color:#94a3b8; font-size:11px; margin:16px 0 0 0;">&copy; {{year}} Iris Monde. All rights reserved.</p>
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
